echo "Loading 1280x720 HLTV Healthbars Overlay config"

hltv_healthbar_use_engine_font 0
hltv_general_font "Verdana"
hltv_healthbar_font "Verdana"
hltv_roundtimer_font "Verdana"
hltv_teamscore_font "Verdana"
hltv_teamnames_font "Verdana"
hltv_clanscore_font "Verdana"

hltv_general_font_size "14"
hltv_healthbar_font_size "14"
hltv_roundtimer_font_size "24"
hltv_teamscore_font_size "32"
hltv_teamnames_font_size "32"
hltv_clanscore_font_size "32"
hltv_healthbar_font_yoffset "-4"

hltv_flag_1_xpos 30

hltv_t_3_ypos 150

hltv_t_4_xpos 10
hltv_t_4_ypos 190

hltv_t_5_xpos 10
hltv_t_5_ypos 230

hltv_ct_1_xpos 1070
hltv_ct_1_ypos 70

hltv_ct_2_xpos 1070

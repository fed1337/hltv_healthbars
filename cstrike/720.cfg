hltv_topbar_xpos 0
hltv_topbar_ypos 0
hltv_topbar_width 1280
hltv_topbar_height 60

hltv_draw_scoreboard "0"
hltv_draw_healthbars "1"
hltv_draw_topbar "1"
hltv_c4timer "35"

hltv_roundtimer_xpos 650
hltv_roundtimer_ypos 32

hltv_team_1_name_xpos 260
hltv_team_1_name_ypos 38

hltv_team_2_name_xpos 1000
hltv_team_2_name_ypos 38

hltv_team_1_clanscore_xpos 530
hltv_team_1_clanscore_ypos 38

hltv_team_1_teamscore_xpos 0
hltv_team_1_teamscore_ypos 0

hltv_team_2_clanscore_xpos 750
hltv_team_2_clanscore_ypos 38

hltv_team_2_teamscore_xpos 0
hltv_team_2_teamscore_ypos 0

hltv_t_1_xpos 10
hltv_t_1_ypos 70

hltv_t_2_xpos 10
hltv_t_2_ypos 110


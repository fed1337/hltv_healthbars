hltv_ct_3_ypos 150

hltv_ct_4_xpos 1070
hltv_ct_4_ypos 190

hltv_ct_5_xpos 1070
hltv_ct_5_ypos 230

hltv_reload

cl_crosshair_size "3"
cl_crosshair_color "0 255 0"
cl_crosshair_translucent "0"
cl_dynamiccrosshair "0"
hud_deathnotice_time "0"

bind "ins" "hltv_increment hltv_team_1_score"
bind "del" "hltv_decrement hltv_team_1_score"

bind "pgup" "hltv_increment hltv_team_2_score"
bind "pgdn" "hltv_decrement hltv_team_2_score"

bind "end" "hltv_swap"
bind "home" "overview"

bind "i" "hltv_reload"
bind "o" "hltv_toggle hltv_draw_scoreboard"

alias overview "overview1"
alias overview1 "spec_mode 5; alias overview overview2"
alias overview2 "spec_mode 4; alias overview overview1"

echo "HLTV Healthbars Overlay config for 1280x720 resolution is loaded"
